{% extends "base.html" %}

{% block title %}Pimpinan{% endblock %}

{% block content %}
<div class="pimpinan-halaman">

  <h1 class="pimpinan-judul">Pimpinan</h1>

  <div class="pimpinan-grid">
    {% for p in pimpinan_list %}
      <div class="pimpinan-kartu">
        {% if p.foto %}
          <img class="pimpinan-foto" src="{{ p.foto.url }}" alt="{{ p.nama }}">
        {% else %}
          <div class="pimpinan-foto pimpinan-tanpa-foto">Tanpa foto</div>
        {% endif %}
        <h3 class="pimpinan-nama">{{ p.nama }}</h3>
        <p class="pimpinan-jabatan"><strong>{{ p.jabatan }}</strong></p>
        <p class="pimpinan-periode">Periode {{ p.periode }}</p>
      </div>
    {% empty %}
      <p class="pimpinan-kosong">Belum ada data pimpinan.</p>
    {% endfor %}
  </div>

</div>
{% endblock %}
