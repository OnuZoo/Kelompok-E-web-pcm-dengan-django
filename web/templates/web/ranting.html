<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranting</title>
</head>
<body>
    <h1>Daftar Ranting</h1>

    <table border="1" cellpadding="8" cellspacing="0" width="100%">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Ranting</th>
                <th>Alamat</th>
                <th>Ketua</th>
                <th>Telepon</th>
            </tr>
        </thead>
        <tbody>
            {% for ranting in ranting_list %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ ranting.nama }}</td>
                <td>{{ ranting.alamat }}</td>
                <td>{{ ranting.ketua }}</td>
                <td>{{ ranting.telepon }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" align="center">Belum ada data ranting.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
