{% load static %}

{% with nama=request.resolver_match.url_name %}
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2"
       href="{% url 'web:beranda' %}">

      <img
        src="{% static 'img/logo-muhammadiyah.webp' %}"
        alt="Logo Muhammadiyah"
        width="45"
        height="45"
        class="object-fit-contain"
      >

      <span>
        <strong>{{ profil.nama_singkat|default:"PCM" }}</strong>
        {% if profil.tagline %}
          <small class="d-block fs-6 fw-normal">
            {{ profil.tagline }}
          </small>
        {% endif %}
      </span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {% if nama == 'beranda' %}active{% endif %}" href="{% url 'web:beranda' %}">Beranda</a></li>

        <li class="nav-item dropdown">
          <button type="button" class="nav-link dropdown-toggle {% if nama == 'profil' or nama == 'pimpinan' or nama == 'ranting' or nama == 'amal_usaha' %}active{% endif %}" data-bs-toggle="dropdown" aria-expanded="false">Tentang Kami</button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item {% if nama == 'profil' %}active{% endif %}" href="{% url 'web:profil' %}">Profil</a></li>
            <li><a class="dropdown-item {% if nama == 'pimpinan' %}active{% endif %}" href="{% url 'web:pimpinan' %}">Pimpinan</a></li>
            <li><a class="dropdown-item {% if nama == 'ranting' %}active{% endif %}" href="{% url 'web:ranting' %}">Ranting</a></li>
            <li><a class="dropdown-item {% if nama == 'amal_usaha' %}active{% endif %}" href="{% url 'web:amal_usaha' %}">Amal Usaha</a></li>
          </ul>
        </li>

        <li class="nav-item"><a class="nav-link {% if nama == 'berita' or nama == 'berita_detail' %}active{% endif %}" href="{% url 'web:berita' %}">Berita</a></li>
        <li class="nav-item"><a class="nav-link {% if nama == 'agenda' %}active{% endif %}" href="{% url 'web:agenda' %}">Agenda</a></li>
        <li class="nav-item"><a class="nav-link {% if nama == 'unduhan' %}active{% endif %}" href="{% url 'web:unduhan' %}">Unduhan</a></li>
        <li class="nav-item"><a class="nav-link {% if nama == 'kontak' %}active{% endif %}" href="{% url 'web:kontak' %}">Kontak</a></li>
      </ul>
    </div>
  </div>
</nav>
{% endwith %}
