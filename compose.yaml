services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pcm
      POSTGRES_USER: pcm
      POSTGRES_PASSWORD: pcm_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcm -d pcm"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://pcm:pcm_dev_password@db:5432/pcm
      SECRET_KEY: ${SECRET_KEY:-kunci-khusus-docker-lokal-bukan-untuk-produksi}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
